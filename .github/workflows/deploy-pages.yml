name: Deploy AI Business Agent Admin to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://emwvtsxeekjjrfutzlmf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtd3Z0c3hlZWtqanJmdXR6bG1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NDQ4MTUsImV4cCI6MjExMTEyMDgxNX0.Qo6jgQoYowW0a3NDKLUMnTMZZsK4_JzNpfy-hILQetU
          NEXT_PUBLIC_API_BASE_URL: https://ai-business-agent.workers.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 41dab722cf0e73632d542b48d248e1f2
          command: pages deploy out --project-name=ai-business-agent-admin --branch=main
