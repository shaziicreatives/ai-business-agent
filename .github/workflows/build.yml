name: Build and typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:worker
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://emwvtsxeekjjrfutzlmf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtd3Z0c3hlZWtqanJmdXR6bG1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NDQ4MTUsImV4cCI6MjExMTEyMDgxNX0.Qo6jgQoYowW0a3NDKLUMnTMZZsK4_JzNpfy-hILQetU
          NEXT_PUBLIC_API_BASE_URL: https://ai-business-agent-api.ai-business-agent.workers.dev
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-business-agent-static-site
          path: out/
          if-no-files-found: error
          retention-days: 7
